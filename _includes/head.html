    <!-- Metadata, OpenGraph and Schema.org -->
    {% include metadata.html %}

    <!-- Theme: applied before paint to avoid a flash -->
    <script>
      (function () { try { var t = localStorage.getItem("theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {} })();
    </script>
    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b1320" media="(prefers-color-scheme: dark)">

    <!-- Fonts & Icons (self-hosted) -->
    <link rel="preload" href="{{ '/assets/fonts/fraunces-latin-full-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ '/assets/fonts/inter-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/lib/fontawesome/css/all.min.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/lib/academicons/css/academicons.min.css' | relative_url }}">

    <!-- Favicon -->
    {% if site.icon.size < 3 %}
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>{{ site.icon }}</text></svg>">
    {% elsif site.icon != blank %}
    <link rel="icon" type="image/svg+xml" href="{{ site.icon | prepend: '/assets/img/' | relative_url }}">
    {% endif %}

    <!-- Styles -->
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
    {% if site.rss_icon %}<link rel="alternate" type="application/atom+xml" title="{{ site.first_name }} {{ site.last_name }}" href="{{ '/feed.xml' | relative_url }}">{% endif %}
