---
layout: default
---
<section class="page-hero">
  <div class="wrap wrap--narrow">
    <div class="eyebrow">{% if page.collection == "news" %}News{% else %}{{ page.description | default: "Update" }}{% endif %} · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></div>
    <h1>{{ page.title | default: "News" }}</h1>
  </div>
</section>
<section class="section section--tight">
  <div class="wrap wrap--narrow">
    <article class="prose">
      {{ content }}
    </article>
    <p style="margin-top:3rem"><a class="link-arrow" href="{{ '/news/' | relative_url }}">All news</a></p>
  </div>
</section>
