<!DOCTYPE html>
<html lang="{{ site.lang }}">
  <head>
  {%- if page.redirect %}
    <meta http-equiv="refresh" content="0; url={{ page.redirect | relative_url }}" />
  {%- endif %}
  {% include head.html %}
  </head>
  <body class="layout-{{ page.layout | default: 'default' }}">
    {%- include header.html %}
    <main id="main">
      {{ content }}
    </main>
    {%- include footer.html %}
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/net.js' | relative_url }}" defer></script>
    {%- if page.math %}
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.0/es5/tex-mml-chtml.js"></script>
    {%- endif %}
  </body>
</html>
